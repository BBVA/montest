version: "3"

tasks:
  sync:
    desc: "Sync project dependencies"
    cmds:
      - uv sync --extra dev

  lint:
    desc: "Run ruff linter"
    cmds:
      - uv run ruff check src tests examples/pytest

  typecheck:
    desc: "Run mypy type checker"
    cmds:
      - uv run mypy src tests/typing/pytest_api.py

  test:
    desc: "Run tests via tox (set TOX_ENV to py311/py312/py313/py314)"
    vars:
      TOX_ENV: '{{.TOX_ENV | default "py311"}}'
    cmds:
      - uv run tox -e {{.TOX_ENV}}

  docs:
    desc: "Build Sphinx documentation"
    cmds:
      - uv run sphinx-build -W --keep-going -b html docs docs/_build/html

  viewer:sync:
    desc: "Sync pinned viewer development dependencies"
    dir: viewer
    cmds:
      - npm ci

  viewer:build:
    desc: "Compile the packaged Elm viewer"
    dir: viewer
    cmds:
      - npm run build

  viewer:check:
    desc: "Check compiled viewer asset freshness"
    dir: viewer
    cmds:
      - npm run check

  viewer:test:
    desc: "Test recorded evidence projection"
    dir: viewer
    cmds:
      - npm test
